server {
    listen 80;
    server_name _;

    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    location /cebu/ {
        proxy_pass https://api.attractionsg.com/;
        proxy_set_header Host api.attractionsg.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
    }

    location /cebu-test/ {
        proxy_pass https://tdpapi.attractionsg.com/;
        proxy_set_header Host tdpapi.attractionsg.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
    }
}
